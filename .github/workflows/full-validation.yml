name: Full manufacturing validation

on:
  schedule:
    - cron: '21 19 * * *'
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: pip install -r requirements.txt -r manufacturing/requirements-search.txt
      - name: Reproduce published numerical artifacts
        run: make verify
