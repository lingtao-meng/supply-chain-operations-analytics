name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: pip install -r requirements.txt -r manufacturing/requirements-search.txt
      - name: Validate modules and published numbers
        run: |
          python -m compileall -q python app tests express/src express/scripts manufacturing
          make test-fast
