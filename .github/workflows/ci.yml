name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile
        run: python -m compileall -q python app tests

      - name: SQL syntax + schema test (in-memory, no data needed)
        run: python tests/test_sql_syntax.py
