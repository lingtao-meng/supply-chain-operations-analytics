<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 178" role="img" aria-labelledby="title desc">
  <title id="title">Assembly line with two intermediate buffers</title>
  <desc id="desc">Schematic of a serial line. Work flows from S1 through B1 and S2, then through B2 to S3. Rectangles denote stations and open circles denote waiting positions.</desc>
  <defs><marker id="end" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#53636c"/></marker></defs>
  <rect width="850" height="178" fill="white"/>
  <g stroke="#53636c" fill="none" stroke-width="1.5" marker-end="url(#end)">
    <path d="M51 84H126 M222 84H307 M354 84H399 M495 84H577 M624 84H669 M765 84H800"/>
  </g>
  <g stroke="#34546a" fill="#f4f7f8" stroke-width="1.6">
    <rect x="130" y="58" width="92" height="52"/><rect x="403" y="58" width="92" height="52"/><rect x="673" y="58" width="92" height="52"/>
  </g>
  <g fill="white" stroke="#655f59" stroke-width="1.4">
    <circle cx="321" cy="84" r="8"/><circle cx="344" cy="84" r="8"/><circle cx="591" cy="84" r="8"/><circle cx="614" cy="84" r="8"/>
  </g>
  <g font-family="Georgia,serif" text-anchor="middle" fill="#243138">
    <text x="176" y="91" font-size="22">S1</text><text x="449" y="91" font-size="22">S2</text><text x="719" y="91" font-size="22">S3</text>
    <text x="332" y="122" font-size="16">Buffer 1</text><text x="602" y="122" font-size="16">Buffer 2</text>
    <text x="425" y="155" font-size="14">Serial workstations and intermediate waiting positions (schematic)</text>
  </g>
</svg>
