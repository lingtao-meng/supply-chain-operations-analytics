<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="296" viewBox="0 0 1120 296" role="img" aria-labelledby="title desc">
  <title id="title">Assembly Line Optimization</title>
  <desc id="desc">Manufacturing industrial engineering. Assembly tasks pass through workstations and buffers before independent shift validation.</desc>
