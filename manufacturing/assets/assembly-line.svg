    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 H 0 V 28" fill="none" stroke="#a9c8d8" stroke-opacity=".11"/>
    </pattern>
    <clipPath id="panel">
      <rect width="1120" height="296" rx="22"/>
    </clipPath>
  </defs>
  <g clip-path="url(#panel)">
